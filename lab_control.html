<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Control - Dynamic Device Discovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#0b0f14; --bg2:#111820; --bg3:#161f2a;
    --border:rgba(0,220,180,0.12); --border2:rgba(0,220,180,0.25);
    --accent:#00dca0; --accent2:#00b8e0; --accent3:#e07800;
    --warn:#e04040; --text:#d4e8e0; --text2:#7fa898; --text3:#3a6055;
    --mono:'JetBrains Mono',monospace; --sans:'Space Grotesk',sans-serif;
    --radius:8px; --radius2:4px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;padding-bottom:40px}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px);pointer-events:none;z-index:9999}
  header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--bg2)}
  .logo{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--accent);display:flex;align-items:center;gap:8px}
  .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .header-title{font-size:18px;font-weight:500}
  .header-title span{color:var(--accent)}
  .header-right{margin-left:auto;display:flex;gap:10px;align-items:center}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:7px 14px;border-radius:var(--radius2);border:1px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;transition:all .15s;text-transform:uppercase}
  .btn:hover{background:rgba(0,220,160,.08);border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
  .btn.primary:hover{background:#00f0b0}
  .btn.danger{border-color:var(--warn);color:var(--warn)}
  .btn.danger:hover{background:rgba(224,64,64,.1)}
  .btn.active-on{background:rgba(0,220,160,.15);border-color:var(--accent);color:var(--accent)}
  .main-layout{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;padding:20px 24px}
  .main-layout.no-devices{grid-template-columns:1fr;max-width:600px;margin:40px auto}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .2s}
  .card:hover{border-color:var(--border2)}
  .card-header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg3)}
  .card-icon{width:28px;height:28px;border-radius:var(--radius2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em}
  .icon-psu{background:rgba(0,220,160,.12);color:var(--accent);border:1px solid rgba(0,220,160,.2)}
  .icon-mm{background:rgba(0,184,224,.12);color:var(--accent2);border:1px solid rgba(0,184,224,.2)}
  .icon-dcl{background:rgba(224,120,0,.12);color:var(--accent3);border:1px solid rgba(224,120,0,.2)}
  .card-title{font-size:13px;font-weight:600}
  .card-subtitle{font-family:var(--mono);font-size:10px;color:var(--text2);margin-left:auto;letter-spacing:.06em}
  .conn-indicator{width:6px;height:6px;border-radius:50%;background:var(--text3);transition:background .3s}
  .conn-indicator.connected{background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .card-body{padding:16px}
  .param-row{margin-bottom:14px}
  .param-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
  .param-name{font-family:var(--mono);font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}
  .param-value{font-family:var(--mono);font-size:14px;font-weight:500;display:flex;align-items:baseline;gap:3px}
  .param-value .unit{font-size:10px;color:var(--text2)}
  input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--bg3);border-radius:2px;outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--bg2);box-shadow:0 0 6px rgba(0,220,160,.4);transition:transform .1s}
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
  .param-number{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:4px 8px;font-family:var(--mono);font-size:13px;color:var(--text);width:80px;text-align:right;outline:none}
  .param-number:focus{border-color:var(--accent)}
  .ch-tabs{display:flex;gap:4px;margin-bottom:14px}
  .ch-tab{font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:var(--radius2);border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;letter-spacing:.05em;transition:all .15s}
  .ch-tab.active{background:rgba(0,220,160,.12);border-color:var(--accent);color:var(--accent)}
  .ch-tab:hover:not(.active){border-color:var(--border2);color:var(--text)}
  hr.divider{border:none;border-top:1px solid var(--border);margin:12px 0}
  .output-row{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
  .meas-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .meas-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:10px 12px}
  .meas-label{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
  .meas-value{font-family:var(--mono);font-size:18px;font-weight:500}
  .meas-value .unit{font-size:11px;color:var(--text2)}
  .mode-select{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
  .mode-btn{font-family:var(--mono);font-size:10px;padding:5px 12px;border-radius:var(--radius2);border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;letter-spacing:.04em;transition:all .15s;font-weight:500}
  .mode-btn.active{background:rgba(224,120,0,.15);border-color:var(--accent3);color:var(--accent3)}
  .mode-btn:hover:not(.active){border-color:var(--border2);color:var(--text)}
  .chart-panel{grid-column:1 / -1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .chart-toolbar{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg3);flex-wrap:wrap}
  .chart-title{font-size:13px;font-weight:600}
  .chart-sources{display:flex;gap:6px;margin-left:12px;flex-wrap:wrap}
  .chart-src-btn{font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:var(--radius2);border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
  .chart-src-btn .dot{width:6px;height:6px;border-radius:50%}
  .chart-src-btn.active{background:rgba(255,255,255,.05);border-color:var(--border2);color:var(--text)}
  .chart-body{padding:16px;height:280px;position:relative}
  .config-panel{grid-column:1 / -1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .config-header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg3);flex-wrap:wrap}
  .config-body{padding:16px}
  .config-section{margin-bottom:20px}
  .config-section-title{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:12px;text-transform:uppercase;letter-spacing:.08em}
  .device-config-item{display:flex;gap:12px;align-items:center;margin-bottom:10px;padding:10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2)}
  .device-config-item .label{font-family:var(--mono);font-size:10px;color:var(--text2);min-width:60px;text-transform:uppercase}
  .device-config-item input{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:5px 10px;font-family:var(--mono);font-size:11px;color:var(--text);outline:none;flex:1}
  .device-config-item input:focus{border-color:var(--accent)}
  .device-config-item .port-input{flex:0 0 80px}
  .device-config-item .btn{padding:5px 10px;font-size:9px}
  .no-devices-msg{text-align:center;padding:40px 20px;color:var(--text2)}
  .no-devices-msg h2{color:var(--text);margin-bottom:16px}
  #status-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);padding:6px 24px;display:flex;gap:16px;align-items:center;font-family:var(--mono);font-size:10px;color:var(--text2);z-index:100}
  #status-msg{color:var(--accent)}
  .status-sep{color:var(--text3)}
  .api-status{font-family:var(--mono);font-size:10px;color:var(--text3);display:flex;align-items:center;gap:5px}
  .api-status.ok{color:var(--accent)}
  .mm-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:12px}
  .mm-mode-btn{font-family:var(--mono);font-size:9px;letter-spacing:.04em;padding:5px 4px;border-radius:var(--radius2);border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;text-align:center}
  .mm-mode-btn.active{background:rgba(0,184,224,.12);border-color:var(--accent2);color:var(--accent2)}
  .mm-mode-btn:hover:not(.active){border-color:var(--border2);color:var(--text)}
  label.ch-label{font-family:var(--mono);font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px}
  .quick-config{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .quick-config input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:6px 10px;font-family:var(--mono);font-size:11px;color:var(--text);outline:none}
  .quick-config input:focus{border-color:var(--accent);background:var(--bg2)}
  .quick-config input[type=text]{flex:1;min-width:140px}
  .quick-config input[type=number]{flex:0 0 70px}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--text3);border-radius:2px}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>LAB CTRL</div>
  <div class="header-title">Lab <span>Device Discovery</span></div>
  <div class="header-right" id="header-right" style="display:none">
    <span id="poll-status" class="api-status">● POLL OFF</span>
    <select id="poll-rate" style="background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-family:var(--mono);font-size:10px;padding:5px 8px;border-radius:4px;outline:none">
      <option value="1000">1 s</option>
      <option value="2000" selected>2 s</option>
      <option value="5000">5 s</option>
      <option value="10000">10 s</option>
    </select>
    <button class="btn" id="poll-btn" onclick="togglePolling()">START POLLING</button>
  </div>
</header>

<div class="main-layout" id="main-layout">
  <!-- Content dynamically generated by JavaScript -->
</div>

<div id="status-bar">
  <span id="status-msg">INITIALIZING...</span>
  <span class="status-sep">|</span>
  <span id="poll-interval-display">POLL: OFF</span>
  <span class="status-sep">|</span>
  <span id="data-count">SAMPLES: 0</span>
  <span class="status-sep">|</span>
  <span id="time-display"></span>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════════
// DEVICE DISCOVERY AND DYNAMIC UI GENERATION
// ════════════════════════════════════════════════════════════════════════════

let discoveredDevices = [];
let liveChart = null;
let pollTimer = null;
let pollActive = false;
let sampleCount = 0;
const MAX_PTS = 120;

const serverUrl = () => {
  const base = (window.location.origin || `${window.location.protocol}//${window.location.host}`);
  return base;
};

const apiBase = () => serverUrl() + '/api';

async function apiFetch(url, opts = {}) {
  const r = await fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function setStatus(msg, err) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.style.color = err ? 'var(--warn)' : 'var(--accent)';
}

// ────────────────────────────────────────────────────────────────────────────
// DEVICE DISCOVERY
// ────────────────────────────────────────────────────────────────────────────

async function discoverDevices() {
  try {
    setStatus('Discovering devices...');
    const resp = await apiFetch(apiBase() + '/discover');
    discoveredDevices = resp.devices || [];
    generateUI();
  } catch (e) {
    setStatus('Discovery failed: ' + e.message, true);
    generateConfigPanel();
  }
}

function generateUI() {
  const layout = document.getElementById('main-layout');
  if (discoveredDevices.length === 0) {
    generateConfigPanel();
    return;
  }

  layout.className = 'main-layout';
  layout.innerHTML = '';

  // Generate device cards
  for (const device of discoveredDevices) {
    const card = generateDeviceCard(device);
    layout.appendChild(card);
  }

  // Add chart panel
  const chartPanel = generateChartPanel();
  layout.appendChild(chartPanel);

  // Initialize chart
  initChart();

  // Show polling controls
  const headerRight = document.getElementById('header-right');
  if (headerRight) {
    headerRight.style.display = 'flex';
  }
}

function generateDeviceCard(device) {
  const card = document.createElement('div');
  card.className = 'card';

  const header = document.createElement('div');
  header.className = 'card-header';
  const connClass = device.connected ? 'connected' : 'error';
  const connStatus = device.connected ? 'ONLINE' : 'OFFLINE';
  header.innerHTML = `
    <div class="card-icon ${device.iconClass || 'icon-psu'}">${device.name.substring(0, 3)}</div>
    <span class="card-title">${device.fullName || device.name}</span>
    <div class="conn-indicator ${connClass}"></div>
    <span class="card-subtitle" style="color:${device.connected ? '#3a6055' : '#e04040'}">${connStatus}</span>
  `;
  card.appendChild(header);

  const body = document.createElement('div');
  body.className = 'card-body';
  body.id = `device-${device.id}`;
  
  if (!device.connected) {
    body.innerHTML = `
      <div style="background:rgba(224,64,64,.08);border:1px solid rgba(224,64,64,.2);border-radius:4px;padding:12px;margin-bottom:14px;color:var(--warn);font-size:12px">
        <div style="font-weight:600;margin-bottom:8px">Device Offline</div>
        <div>Not reachable at ${device.ip}:${device.port}</div>
        <div style="font-size:11px;color:var(--text2);margin-top:6px">Configure correct IP/port to enable</div>
      </div>
      <label class="ch-label">Configure IP/Port</label>
      <div class="quick-config">
        <input type="text" value="${device.ip}" id="cfg-ip-${device.id}" placeholder="IP address">
        <input type="number" value="${device.port}" id="cfg-port-${device.id}" placeholder="Port" min="1" max="65535">
        <button class="btn" style="padding:5px 12px;font-size:10px" onclick="updateDeviceConfig('${device.id}')">SAVE</button>
      </div>
      <button class="btn primary" style="width:100%;padding:8px;font-size:11px;margin-top:6px" onclick="connectDevice('${device.id}')">TEST CONNECTION</button>
    `;
  } else {
    // Load device-specific UI
    generateDeviceUI(device, body);
  }
  
  card.appendChild(body);
  return card;
}

function generateDeviceUI(device, container) {
  const id = device.id;

  if (id === 'psu') {
    generatePSUUI(container);
  } else if (id === 'mm') {
    generateMultimeterUI(container);
  } else if (id === 'dcl') {
    generateDCLoadUI(container);
  } else {
    container.innerHTML = `<p>Unknown device: ${id}</p>`;
  }
}

function generatePSUUI(container) {
  container.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <span style="font-family:var(--mono);font-size:10px;color:var(--text3)">→ /api/psu/ · TCP :5025</span>
      <button class="btn" onclick="connectDevice('psu')" style="padding:3px 10px;font-size:10px">PING</button>
    </div>

    <label class="ch-label">Channel</label>
    <div class="ch-tabs">
      <button class="ch-tab active" onclick="setPsuCh(1,this)">CH1</button>
      <button class="ch-tab" onclick="setPsuCh(2,this)">CH2</button>
      <button class="ch-tab" onclick="setPsuCh(3,this)">CH3</button>
      <button class="ch-tab" onclick="setPsuCh(4,this)">CH4</button>
    </div>

    <div class="param-row">
      <div class="param-label">
        <span class="param-name">Voltage</span>
        <div class="param-value">
          <input class="param-number" type="number" id="psu-v-num" value="5.00" min="0" max="30" step="0.1" oninput="syncSlider('psu-v',this.value,0,30)">
          <span class="unit">V</span>
        </div>
      </div>
      <input type="range" id="psu-v" min="0" max="30" step="0.1" value="5" oninput="syncNum('psu-v-num',this.value,'psu-v',0,30,'#00dca0')">
    </div>

    <div class="param-row">
      <div class="param-label">
        <span class="param-name">Current limit</span>
        <div class="param-value">
          <input class="param-number" type="number" id="psu-i-num" value="2.00" min="0" max="10" step="0.1" oninput="syncSlider('psu-i',this.value,0,10)">
          <span class="unit">A</span>
        </div>
      </div>
      <input type="range" id="psu-i" min="0" max="10" step="0.1" value="2" oninput="syncNum('psu-i-num',this.value,'psu-i',0,10,'#00dca0')">
    </div>

    <hr class="divider">
    <div class="meas-grid">
      <div class="meas-box"><div class="meas-label">V actual</div><div class="meas-value" id="psu-meas-v">—<span class="unit"> V</span></div></div>
      <div class="meas-box"><div class="meas-label">I actual</div><div class="meas-value" id="psu-meas-i">—<span class="unit"> A</span></div></div>
    </div>
    <div class="output-row">
      <button class="btn" id="psu-out-btn" onclick="psuToggleOutput()">OUTPUT ON</button>
      <button class="btn" onclick="psuApply()">APPLY</button>
      <button class="btn" onclick="psuMeasure()">MEASURE</button>
    </div>
  `;
  updateSliderBg('psu-v', 5, 0, 30, '#00dca0');
  updateSliderBg('psu-i', 2, 0, 10, '#00dca0');
}

function generateMultimeterUI(container) {
  container.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <span style="font-family:var(--mono);font-size:10px;color:var(--text3)">→ /api/mm/ · TCP :3000</span>
      <button class="btn" onclick="connectDevice('mm')" style="padding:3px 10px;font-size:10px;color:var(--accent2);border-color:rgba(0,184,224,.3)">PING</button>
    </div>

    <label class="ch-label">Measurement mode</label>
    <div class="mm-modes">
      <button class="mm-mode-btn active" data-mode="dc_voltage" onclick="setMMMode('dc_voltage',this)">DC V</button>
      <button class="mm-mode-btn" data-mode="ac_voltage" onclick="setMMMode('ac_voltage',this)">AC V</button>
      <button class="mm-mode-btn" data-mode="dc_current" onclick="setMMMode('dc_current',this)">DC A</button>
      <button class="mm-mode-btn" data-mode="ac_current" onclick="setMMMode('ac_current',this)">AC A</button>
      <button class="mm-mode-btn" data-mode="resistance" onclick="setMMMode('resistance',this)">OHM</button>
      <button class="mm-mode-btn" data-mode="continuity" onclick="setMMMode('continuity',this)">CONT</button>
      <button class="mm-mode-btn" data-mode="diode" onclick="setMMMode('diode',this)">DIODE</button>
      <button class="mm-mode-btn" data-mode="capacitance" onclick="setMMMode('capacitance',this)">CAP</button>
      <button class="mm-mode-btn" data-mode="frequency" onclick="setMMMode('frequency',this)">FREQ</button>
    </div>

    <div class="meas-grid">
      <div class="meas-box" style="grid-column:1/-1">
        <div class="meas-label" id="mm-meas-label">DC Voltage</div>
        <div class="meas-value" style="font-size:28px" id="mm-meas-main">—<span class="unit" id="mm-unit"> V</span></div>
      </div>
      <div class="meas-box"><div class="meas-label">Min</div><div class="meas-value" id="mm-min" style="font-size:14px">—</div></div>
      <div class="meas-box"><div class="meas-label">Max</div><div class="meas-value" id="mm-max" style="font-size:14px">—</div></div>
    </div>

    <div class="output-row">
      <button class="btn" onclick="mmMeasure()" style="color:var(--accent2);border-color:rgba(0,184,224,.3)">MEASURE</button>
      <button class="btn" onclick="mmReset()">RESET MIN/MAX</button>
    </div>
  `;
}

function generateDCLoadUI(container) {
  container.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <span style="font-family:var(--mono);font-size:10px;color:var(--text3)">→ /api/dcload/ · UDP :18190</span>
      <button class="btn" onclick="connectDevice('dcl')" style="padding:3px 10px;font-size:10px;color:var(--accent3);border-color:rgba(224,120,0,.3)">PING</button>
    </div>

    <label class="ch-label">Mode</label>
    <div class="mode-select">
      <button class="mode-btn active" id="dcl-mode-CC" onclick="setDclMode('CC',this)">CC</button>
      <button class="mode-btn" id="dcl-mode-CV" onclick="setDclMode('CV',this)">CV</button>
      <button class="mode-btn" id="dcl-mode-CP" onclick="setDclMode('CP',this)">CP</button>
      <button class="mode-btn" id="dcl-mode-CR" onclick="setDclMode('CR',this)">CR</button>
    </div>

    <div class="param-row">
      <div class="param-label">
        <span class="param-name" id="dcl-param-name">Current (CC)</span>
        <div class="param-value">
          <input class="param-number" type="number" id="dcl-set-num" value="1.00" min="0" max="30" step="0.1" oninput="syncSlider('dcl-set',this.value,0,30)">
          <span class="unit" id="dcl-unit">A</span>
        </div>
      </div>
      <input type="range" id="dcl-set" min="0" max="30" step="0.1" value="1" oninput="syncNum('dcl-set-num',this.value,'dcl-set',0,30,'#e07800')">
    </div>

    <hr class="divider">
    <div class="meas-grid">
      <div class="meas-box"><div class="meas-label">V in</div><div class="meas-value" id="dcl-meas-v">—<span class="unit"> V</span></div></div>
      <div class="meas-box"><div class="meas-label">I draw</div><div class="meas-value" id="dcl-meas-i">—<span class="unit"> A</span></div></div>
      <div class="meas-box"><div class="meas-label">P diss</div><div class="meas-value" id="dcl-meas-p">—<span class="unit"> W</span></div></div>
      <div class="meas-box"><div class="meas-label">Mode</div><div class="meas-value" id="dcl-meas-mode" style="font-size:14px">CC</div></div>
    </div>

    <div class="output-row">
      <button class="btn" id="dcl-out-btn" onclick="dclToggleLoad()">LOAD ON</button>
      <button class="btn" onclick="dclApply()" style="color:var(--accent3);border-color:rgba(224,120,0,.3)">APPLY</button>
      <button class="btn" onclick="dclMeasure()">MEASURE</button>
    </div>
  `;
  updateSliderBg('dcl-set', 1, 0, 30, '#e07800');
}

function generateChartPanel() {
  const panel = document.createElement('div');
  panel.className = 'chart-panel';
  panel.innerHTML = `
    <div class="chart-toolbar">
      <span class="chart-title">Live Data</span>
      <div class="chart-sources" id="chart-sources"></div>
      <div style="margin-left:auto;display:flex;gap:6px">
        <button class="btn" onclick="clearChart()">CLEAR</button>
        <button class="btn" onclick="exportCSV()">EXPORT CSV</button>
      </div>
    </div>
    <div class="chart-body">
      <canvas id="liveChart"></canvas>
    </div>
  `;
  return panel;
}

function generateConfigPanel() {
  const layout = document.getElementById('main-layout');
  layout.className = 'main-layout no-devices';
  layout.innerHTML = `
    <div class="card">
      <div class="card-header" style="background:rgba(224,64,64,.1);border-bottom-color:rgba(224,64,64,.2)">
        <span class="card-title" style="color:var(--warn)">● No Devices Found</span>
      </div>
      <div class="card-body">
        <div class="no-devices-msg">
          <h2>Device Discovery Failed</h2>
          <p>No devices could be reached at their default IPs.</p>
          <p style="margin:16px 0;font-size:12px">Check your network connection or configure device IP/port below.</p>
        </div>

        <div class="config-panel" style="border:none;background:transparent;margin-top:20px">
          <div class="config-body">
            <div class="config-section" id="config-devices-section">
              <div class="config-section-title">Device Configuration</div>
              <div id="device-configs-list"></div>
            </div>

            <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);text-align:center">
              <button class="btn primary" onclick="rediscoverDevices()" style="padding:10px 20px;font-size:12px">RETRY DISCOVERY</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  // Load and display device configs
  loadDeviceConfigs();
}

async function loadDeviceConfigs() {
  const container = document.getElementById('device-configs-list');
  if (!container) return;
  
  container.innerHTML = '';

  // Load configs for PSU, MM, DCL
  for (const devId of ['psu', 'mm', 'dcl']) {
    try {
      const resp = await apiFetch(apiBase() + `/device/${devId}/config`);
      const item = document.createElement('div');
      item.className = 'device-config-item';
      item.innerHTML = `
        <span class="label">${devId.toUpperCase()}</span>
        <input type="text" value="${resp.ip}" id="cfg-ip-${devId}" placeholder="IP address">
        <input type="number" value="${resp.port}" id="cfg-port-${devId}" class="port-input" placeholder="Port" min="1" max="65535">
        <button class="btn" onclick="updateDeviceConfig('${devId}')">UPDATE</button>
      `;
      container.appendChild(item);
    } catch (e) {
      // Device not available
    }
  }
}

async function updateDeviceConfig(devId) {
  const ip = document.getElementById(`cfg-ip-${devId}`).value;
  const port = parseInt(document.getElementById(`cfg-port-${devId}`).value);

  if (!ip || !port) {
    setStatus('IP and port required', true);
    return;
  }

  try {
    setStatus(`Updating ${devId.toUpperCase()} configuration...`);
    await apiFetch(apiBase() + `/device/${devId}/config`, {
      method: 'POST',
      body: JSON.stringify({ ip, port })
    });
    setStatus(`${devId.toUpperCase()} config updated. Testing connection...`);
    // Rediscover devices after config update
    setTimeout(() => {
      discoverDevices();
    }, 500);
  } catch (e) {
    setStatus(`Failed to update ${devId}: ${e.message}`, true);
  }
}

async function rediscoverDevices() {
  setStatus('Re-discovering devices...');
  await discoverDevices();
}

async function connectDevice(dev) {
  setStatus('Testing ' + dev.toUpperCase() + ' connection...');
  try {
    // Try to get device status via device-specific endpoint
    const endpoint = dev === 'dcl' ? 'dcload' : dev;
    await apiFetch(apiBase() + `/${endpoint}/status`);
    setStatus(dev.toUpperCase() + ' OK - Connection successful', false);
    // Rediscover to update UI
    setTimeout(() => discoverDevices(), 200);
  } catch (e) {
    setStatus(dev.toUpperCase() + ' - Connection failed, verify IP/port', true);
  }
}

// ────────────────────────────────────────────────────────────────────────────
// SLIDER HELPERS
// ────────────────────────────────────────────────────────────────────────────

function syncNum(numId, val, sliderId, min, max, color) {
  document.getElementById(numId).value = parseFloat(val).toFixed(2);
  updateSliderBg(sliderId, parseFloat(val), min, max, color);
}

function syncSlider(sliderId, val, min, max) {
  document.getElementById(sliderId).value = val;
}

function updateSliderBg(id, val, min, max, color) {
  const elem = document.getElementById(id);
  if (!elem) {
    console.warn(`Slider element ${id} not found`);
    return;
  }
  const pct = ((val - min) / (max - min)) * 100;
  elem.style.background = `linear-gradient(to right,${color} ${pct}%,#161f2a ${pct}%)`;
}

// ────────────────────────────────────────────────────────────────────────────
// CHART
// ────────────────────────────────────────────────────────────────────────────

function initChart() {
  const sourceContainer = document.getElementById('chart-sources');
  if (!sourceContainer) return;

  sourceContainer.innerHTML = `
    <button class="chart-src-btn active" onclick="toggleSeries(0,this)"><span class="dot" style="background:#00dca0"></span>PSU Voltage</button>
    <button class="chart-src-btn active" onclick="toggleSeries(1,this)"><span class="dot" style="background:#80ffd0"></span>PSU Current</button>
    <button class="chart-src-btn active" onclick="toggleSeries(2,this)"><span class="dot" style="background:#00b8e0"></span>DMM</button>
    <button class="chart-src-btn active" onclick="toggleSeries(3,this)"><span class="dot" style="background:#e07800"></span>Load Voltage</button>
    <button class="chart-src-btn active" onclick="toggleSeries(4,this)"><span class="dot" style="background:#ffa040"></span>Load Current</button>
  `;

  const canvasElem = document.getElementById('liveChart');
  if (!canvasElem) {
    console.warn('Chart canvas element not found');
    return;
  }

  liveChart = new Chart(canvasElem.getContext('2d'), {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: 'PSU Voltage (V)', data: [], borderColor: '#00dca0', borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: false },
        { label: 'PSU Current (A)', data: [], borderColor: '#80ffd0', borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: false },
        { label: 'DMM Reading', data: [], borderColor: '#00b8e0', borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: false },
        { label: 'Load Voltage (V)', data: [], borderColor: '#e07800', borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: false },
        { label: 'Load Current (A)', data: [], borderColor: '#ffa040', borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: false },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      scales: {
        x: { ticks: { color: '#3a6055', font: { family: "'JetBrains Mono'", size: 9 }, maxTicksLimit: 10 }, grid: { color: 'rgba(0,220,160,0.05)' } },
        y: { ticks: { color: '#3a6055', font: { family: "'JetBrains Mono'", size: 9 } }, grid: { color: 'rgba(0,220,160,0.06)' } }
      },
      plugins: {
        legend: { display: false },
        tooltip: { bodyFont: { family: "'JetBrains Mono'", size: 11 }, titleFont: { family: "'JetBrains Mono'", size: 11 }, backgroundColor: '#111820', borderColor: 'rgba(0,220,160,0.2)', borderWidth: 1 }
      }
    }
  });
}

function pushChart(idx, val) {
  if (!liveChart) return;
  const ts = new Date().toLocaleTimeString();
  if (!liveChart.data.labels.length || liveChart.data.labels[liveChart.data.labels.length - 1] !== ts) {
    liveChart.data.labels.push(ts);
    if (liveChart.data.labels.length > MAX_PTS) liveChart.data.labels.shift();
  }
  liveChart.data.datasets[idx].data.push(val);
  if (liveChart.data.datasets[idx].data.length > MAX_PTS) liveChart.data.datasets[idx].data.shift();
  liveChart.update('quiet');
  sampleCount++;
  document.getElementById('data-count').textContent = 'SAMPLES: ' + sampleCount;
}

function toggleSeries(idx, btn) {
  if (!liveChart) return;
  btn.classList.toggle('active');
  const meta = liveChart.getDatasetMeta(idx);
  meta.hidden = !meta.hidden;
  liveChart.update();
}

function clearChart() {
  if (!liveChart) return;
  liveChart.data.labels = [];
  liveChart.data.datasets.forEach(d => d.data = []);
  liveChart.update();
  sampleCount = 0;
  document.getElementById('data-count').textContent = 'SAMPLES: 0';
  setStatus('Chart cleared');
}

function exportCSV() {
  if (!liveChart) return;
  const ds = liveChart.data.datasets;
  const lb = liveChart.data.labels;
  let csv = 'Time,PSU_V,PSU_I,DMM,Load_V,Load_I\n';
  lb.forEach((t, i) => {
    csv += [t, ds[0].data[i] ?? '', ds[1].data[i] ?? '', ds[2].data[i] ?? '', ds[3].data[i] ?? '', ds[4].data[i] ?? ''].join(',') + '\n';
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `lab_${Date.now()}.csv`;
  a.click();
  setStatus('CSV exported');
}

// ────────────────────────────────────────────────────────────────────────────
// POLLING
// ────────────────────────────────────────────────────────────────────────────

function togglePolling() {
  pollActive = !pollActive;
  const btn = document.getElementById('poll-btn');
  const ind = document.getElementById('poll-status');
  if (pollActive) {
    const ms = parseInt(document.getElementById('poll-rate').value) || 2000;
    btn.textContent = 'STOP POLLING';
    btn.classList.add('active-on');
    ind.textContent = '● POLLING';
    ind.className = 'api-status ok';
    document.getElementById('poll-interval-display').textContent = 'POLL: ' + (ms / 1000) + 's';
    pollTimer = setInterval(() => {
      Promise.allSettled([psuMeasure(), mmMeasure(), dclMeasure()]);
    }, ms);
    Promise.allSettled([psuMeasure(), mmMeasure(), dclMeasure()]);
  } else {
    clearInterval(pollTimer);
    btn.textContent = 'START POLLING';
    btn.classList.remove('active-on');
    ind.textContent = '● POLL OFF';
    ind.className = 'api-status';
    document.getElementById('poll-interval-display').textContent = 'POLL: OFF';
  }
}

// ────────────────────────────────────────────────────────────────────────────
// PSU CONTROL
// ────────────────────────────────────────────────────────────────────────────

let psuCh = 1, psuOutputOn = false;

function setPsuCh(ch, el) {
  psuCh = ch;
  document.querySelectorAll('.ch-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  setStatus('PSU channel ' + ch + ' selected');
}

async function psuToggleOutput() {
  psuOutputOn = !psuOutputOn;
  const btn = document.getElementById('psu-out-btn');
  try {
    await apiFetch(apiBase() + `/psu/channel/${psuCh}/${psuOutputOn ? 'output_on' : 'output_off'}`, { method: 'POST' });
    btn.textContent = psuOutputOn ? 'OUTPUT OFF' : 'OUTPUT ON';
    btn.className = psuOutputOn ? 'btn active-on' : 'btn';
    setStatus('PSU CH' + psuCh + ' output ' + (psuOutputOn ? 'ON' : 'OFF'));
  } catch (e) {
    psuOutputOn = !psuOutputOn;
    setStatus('PSU output toggle failed: ' + e.message, true);
  }
}

async function psuApply() {
  const v = parseFloat(document.getElementById('psu-v-num').value);
  const i = parseFloat(document.getElementById('psu-i-num').value);
  try {
    await apiFetch(apiBase() + `/psu/channel/${psuCh}/voltage`, { method: 'POST', body: JSON.stringify({ voltage: v }) });
    await apiFetch(apiBase() + `/psu/channel/${psuCh}/current`, { method: 'POST', body: JSON.stringify({ current: i }) });
    setStatus(`PSU CH${psuCh} → ${v.toFixed(2)}V / ${i.toFixed(2)}A`);
  } catch (e) {
    setStatus('PSU apply failed: ' + e.message, true);
  }
}

async function psuMeasure() {
  try {
    const d = await apiFetch(apiBase() + `/psu/channel/${psuCh}/measure`);
    const v = parseFloat(d.voltage || d.v || 0);
    const i = parseFloat(d.current || d.i || 0);
    document.getElementById('psu-meas-v').innerHTML = v.toFixed(3) + '<span class="unit"> V</span>';
    document.getElementById('psu-meas-i').innerHTML = i.toFixed(3) + '<span class="unit"> A</span>';
    pushChart(0, v);
    pushChart(1, i);
  } catch (e) {
    setStatus('PSU measure failed: ' + e.message, true);
  }
}

// ────────────────────────────────────────────────────────────────────────────
// MULTIMETER CONTROL
// ────────────────────────────────────────────────────────────────────────────

let mmMode = 'dc_voltage', mmMin = null, mmMax = null;
const mmLabels = {
  dc_voltage: 'DC Voltage', ac_voltage: 'AC Voltage', dc_current: 'DC Current', ac_current: 'AC Current',
  resistance: 'Resistance', continuity: 'Continuity', diode: 'Diode', capacitance: 'Capacitance', frequency: 'Frequency'
};
const mmUnits = {
  dc_voltage: 'V', ac_voltage: 'V', dc_current: 'A', ac_current: 'A',
  resistance: 'Ω', continuity: 'Ω', diode: 'V', capacitance: 'F', frequency: 'Hz'
};

function setMMMode(mode, el) {
  mmMode = mode;
  document.querySelectorAll('.mm-mode-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('mm-meas-label').textContent = mmLabels[mode] || mode;
  document.getElementById('mm-unit').textContent = ' ' + (mmUnits[mode] || '');
}

async function mmMeasure() {
  try {
    const d = await apiFetch(apiBase() + `/mm/measure/${mmMode}`);
    const v = parseFloat(d.value || d.result || d.measurement || 0);
    document.getElementById('mm-meas-main').innerHTML = v.toFixed(4) + '<span class="unit" id="mm-unit"> ' + (mmUnits[mmMode] || '') + '</span>';
    if (mmMin === null || v < mmMin) { mmMin = v; document.getElementById('mm-min').textContent = v.toFixed(4); }
    if (mmMax === null || v > mmMax) { mmMax = v; document.getElementById('mm-max').textContent = v.toFixed(4); }
    pushChart(2, v);
    setStatus('DMM: ' + v.toFixed(4) + ' ' + (mmUnits[mmMode] || ''));
  } catch (e) {
    setStatus('DMM failed: ' + e.message, true);
  }
}

function mmReset() {
  mmMin = mmMax = null;
  document.getElementById('mm-min').textContent = '—';
  document.getElementById('mm-max').textContent = '—';
  setStatus('DMM min/max reset');
}

// ────────────────────────────────────────────────────────────────────────────
// DC LOAD CONTROL
// ────────────────────────────────────────────────────────────────────────────

let dclMode = 'CC', dclLoadOn = false;
const dclCfg = {
  CC: { name: 'Current (CC)', unit: 'A', min: 0, max: 30, step: 0.1, ep: 'current' },
  CV: { name: 'Voltage (CV)', unit: 'V', min: 0, max: 80, step: 0.1, ep: 'voltage' },
  CP: { name: 'Power (CP)', unit: 'W', min: 0, max: 200, step: 1, ep: 'power' },
  CR: { name: 'Resistance (CR)', unit: 'Ω', min: 0.1, max: 1000, step: 0.1, ep: 'resistance' },
};

function setDclMode(mode, el) {
  dclMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  const c = dclCfg[mode];
  document.getElementById('dcl-param-name').textContent = c.name;
  document.getElementById('dcl-unit').textContent = c.unit;
  const sl = document.getElementById('dcl-set');
  sl.min = c.min;
  sl.max = c.max;
  sl.step = c.step;
  sl.value = c.min;
  document.getElementById('dcl-set-num').value = c.min.toFixed(1);
  document.getElementById('dcl-set-num').min = c.min;
  document.getElementById('dcl-set-num').max = c.max;
  document.getElementById('dcl-set-num').step = c.step;
  updateSliderBg('dcl-set', c.min, c.min, c.max, '#e07800');
  document.getElementById('dcl-meas-mode').textContent = mode;
}

async function dclToggleLoad() {
  dclLoadOn = !dclLoadOn;
  const btn = document.getElementById('dcl-out-btn');
  try {
    await apiFetch(apiBase() + `/dcload/${dclLoadOn ? 'load_on' : 'load_off'}`, { method: 'POST' });
    btn.textContent = dclLoadOn ? 'LOAD OFF' : 'LOAD ON';
    btn.className = dclLoadOn ? 'btn active-on' : 'btn';
    setStatus('DC Load ' + (dclLoadOn ? 'ON' : 'OFF'));
  } catch (e) {
    dclLoadOn = !dclLoadOn;
    setStatus('Load toggle failed: ' + e.message, true);
  }
}

async function dclApply() {
  const val = parseFloat(document.getElementById('dcl-set-num').value);
  const c = dclCfg[dclMode];
  try {
    await apiFetch(apiBase() + `/dcload/mode`, { method: 'POST', body: JSON.stringify({ mode: dclMode }) });
    await apiFetch(apiBase() + `/dcload/set/${c.ep}`, { method: 'POST', body: JSON.stringify({ value: val }) });
    setStatus(`DCLoad ${dclMode} → ${val.toFixed(2)} ${c.unit}`);
  } catch (e) {
    setStatus('DCLoad apply failed: ' + e.message, true);
  }
}

async function dclMeasure() {
  try {
    const d = await apiFetch(apiBase() + `/dcload/measure`);
    const v = parseFloat(d.voltage || d.v || 0), i = parseFloat(d.current || d.i || 0);
    document.getElementById('dcl-meas-v').innerHTML = v.toFixed(3) + '<span class="unit"> V</span>';
    document.getElementById('dcl-meas-i').innerHTML = i.toFixed(3) + '<span class="unit"> A</span>';
    document.getElementById('dcl-meas-p').innerHTML = (v * i).toFixed(2) + '<span class="unit"> W</span>';
    pushChart(3, v);
    pushChart(4, i);
    setStatus(`DCLoad: ${v.toFixed(3)}V / ${i.toFixed(3)}A`);
  } catch (e) {
    setStatus('DCLoad measure failed: ' + e.message, true);
  }
}

// ────────────────────────────────────────────────────────────────────────────
// INITIALIZATION
// ────────────────────────────────────────────────────────────────────────────

setInterval(() => document.getElementById('time-display').textContent = new Date().toLocaleTimeString(), 1000);

// Start device discovery on page load
window.addEventListener('load', () => {
  discoverDevices();
});
</script>
